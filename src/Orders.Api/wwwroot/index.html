<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Orders</title></head>
<body>
  <h1>Orders</h1>

  <section id="anonymous" hidden>
    <p>You are not signed in.</p>
    <a data-testid="login" href="/login">Log in</a>
  </section>

  <section id="app" hidden>
    <p>Signed in as <strong data-testid="user" id="user"></strong> <a href="/logout">Log out</a></p>

    <h2>New order</h2>
    <label>Product <input data-testid="product" id="product"></label>
    <label>Quantity <input data-testid="quantity" id="quantity" type="number" value="1"></label>
    <button data-testid="submit" id="submit">Place order</button>
    <p data-testid="result" id="result"></p>

    <h2>My orders</h2>
    <ul data-testid="orders-list" id="orders-list"></ul>
  </section>

  <script>
    const $ = id => document.getElementById(id);

    async function loadOrders() {
      const res = await fetch('/orders');
      if (!res.ok) return;
      const list = $('orders-list');
      list.replaceChildren();
      for (const o of await res.json()) {
        const li = document.createElement('li');
        li.textContent = o.productName + ' (' + o.status + ')';
        list.appendChild(li);
      }
    }

    async function init() {
      const me = await fetch('/me');
      if (!me.ok) { $('anonymous').hidden = false; return; }
      $('user').textContent = (await me.json()).name;
      $('app').hidden = false;
      await loadOrders();
    }

    // One key per order attempt: a double click or a retry sends the same key, so the server
    // returns the first order instead of charging twice. A new key is made after each success.
    let orderAttemptKey = crypto.randomUUID();

    $('submit').onclick = async () => {
      const res = await fetch('/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Idempotency-Key': orderAttemptKey },
        body: JSON.stringify({
          productName: $('product').value,
          quantity: Number($('quantity').value)
        })
      });
      const out = $('result');
      // 202: charged (or attempted) but not confirmed yet. Keep the same key: ordering again with
      // it settles this order instead of placing a new one.
      if (res.status === 202) { out.textContent = 'Order Pending: payment not confirmed yet. Place the order again to retry.'; await loadOrders(); }
      else if (res.ok) { orderAttemptKey = crypto.randomUUID(); out.textContent = 'Order ' + (await res.json()).status; await loadOrders(); }
      else if (res.status === 401) { out.textContent = 'Please log in'; }
      // The key already placed an order (e.g. its answer was lost) and the form changed since:
      // that order stands, so show it and start a new attempt.
      else if (res.status === 422) { orderAttemptKey = crypto.randomUUID(); out.textContent = 'Your earlier order was already placed, see My orders'; await loadOrders(); }
      // 5xx: not placed and nothing charged; the same key makes a retry safe.
      else if (res.status >= 500) { out.textContent = 'Order not placed, nothing was charged. Please try again.'; }
      else { out.textContent = 'Validation error'; }
    };

    init();
  </script>
</body>
</html>
