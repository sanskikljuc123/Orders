# Added to the chart generated by `aspire publish` (NUKE Publish target copies it in).
# Creates the production "orders" realm after install/upgrade if it does not exist yet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "keycloak-realm-import"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  orders-realm.prod.json: |-
{{ .Files.Get "files/orders-realm.prod.json" | indent 4 }}
  import-realm.sh: |-
{{ .Files.Get "files/import-realm.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-import
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "keycloak-realm-import"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: "keycloak-realm-import"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: import
          image: "quay.io/keycloak/keycloak:26.6"   # must match the chart's keycloak image (checked by NUKE Publish target)
          command: ["/bin/bash", "/realm-import/import-realm.sh"]
          env:
            - name: KEYCLOAK_URL
              value: "http://keycloak-service:8080"
            - name: REALM_FILE
              value: "/realm-import/orders-realm.prod.json"
          envFrom:
            - configMapRef:
                name: "keycloak-config"
            - secretRef:
                name: "keycloak-secrets"
          volumeMounts:
            - name: realm-import
              mountPath: /realm-import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
