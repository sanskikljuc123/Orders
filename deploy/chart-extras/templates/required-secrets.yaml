{{- /*
  Added to the chart generated by `aspire publish` (NUKE Publish target copies it in).
  Renders nothing; stops `helm install/upgrade/template` with a clear message when a password is
  missing. Without them Keycloak exits ("bootstrap-admin-username available only when bootstrap
  admin password is set"), Postgres has no password and the realm Job times out after 10 minutes.
*/ -}}
{{- $s := .Values.secrets -}}
{{- $hint := "pass it with --set (see deploy/values.dev.yaml)" -}}
{{- if not $s.keycloak.keycloak_password }}{{ fail (printf "secrets.keycloak.keycloak_password is empty: %s" $hint) }}{{ end -}}
{{- if not $s.postgres.postgres_password }}{{ fail (printf "secrets.postgres.postgres_password is empty: %s" $hint) }}{{ end -}}
{{- if not $s.api.postgres_password }}{{ fail (printf "secrets.api.postgres_password is empty: %s" $hint) }}{{ end -}}
{{- if ne $s.postgres.postgres_password $s.api.postgres_password }}{{ fail "secrets.api.postgres_password must equal secrets.postgres.postgres_password (the API logs in to that database)" }}{{ end -}}
