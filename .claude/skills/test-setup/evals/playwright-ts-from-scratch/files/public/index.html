<!doctype html>
<html><head><title>Todos</title></head>
<body>
  <h1>Todos</h1>
  <form id="add"><label for="title">New todo</label><input id="title" name="title"><button type="submit">Add</button></form>
  <p id="error" role="alert"></p>
  <ul id="list" data-testid="todo-list"></ul>
  <script>
    const list = document.getElementById('list'), err = document.getElementById('error');
    async function load() {
      const todos = await (await fetch('/api/todos')).json();
      list.innerHTML = '';
      for (const t of todos) {
        const li = document.createElement('li'); li.textContent = t.title + ' ';
        const b = document.createElement('button'); b.textContent = 'Delete'; b.setAttribute('aria-label', 'Delete ' + t.title);
        b.onclick = async () => { await fetch('/api/todos/' + t.id, { method: 'DELETE' }); load(); };
        li.appendChild(b); list.appendChild(li);
      }
    }
    document.getElementById('add').onsubmit = async e => {
      e.preventDefault();
      const res = await fetch('/api/todos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title.value }) });
      err.textContent = res.ok ? '' : (await res.json()).error;
      if (res.ok) { title.value = ''; load(); }
    };
    load();
  </script>
</body></html>
