name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push images to ghcr.io (only on main, see --push-images)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # GitVersion needs the full history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1   # same version as local runs

      # NUKE is the single entry point: Compile, unit + integration tests with coverage gate,
      # Playwright browser install (matching Microsoft.Playwright), E2E,
      # aspire publish + helm lint/template (phase 7 gate), then container images.
      # Pull requests only build the images; pushes to main also push them to ghcr.io.
      - name: Build, test, check Helm chart, build images
        run: ./build.sh --target Test Helm Images --push-images ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          DOTNET_CONTAINER_REGISTRY_UNAME: ${{ github.actor }}
          DOTNET_CONTAINER_REGISTRY_PWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

      - name: Upload Playwright artifacts (trace, screenshot, video)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: tests/Orders.E2E/bin/Debug/net10.0/playwright-artifacts
          if-no-files-found: ignore

  # The same entry point Windows developers use (build.cmd): catches Windows-only problems (paths,
  # line endings, locked files) that the Linux job cannot. Unit + contract tests need no Docker.
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # GitVersion needs the full history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Unit and contract tests (Windows)
        run: .\build.cmd --target UnitTests ContractTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults
