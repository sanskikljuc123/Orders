name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Debug

      - name: Unit tests
        run: dotnet test tests/Orders.UnitTests --no-build --logger trx --results-directory TestResults

      - name: Integration tests
        run: dotnet test tests/Orders.IntegrationTests --no-build --logger trx --results-directory TestResults

      - name: Install Playwright browser
        run: pwsh tests/Orders.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E tests
        run: dotnet test tests/Orders.E2E --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: tests/Orders.E2E/bin/Debug/net10.0/playwright-artifacts
          if-no-files-found: ignore